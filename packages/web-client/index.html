<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Break</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #app,
      #stage-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #stage-wrap {
        overflow: hidden;
      }

      #pixi-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background-color: #000;
        touch-action: none;
        user-select: none;
      }

      #ui-root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage-wrap">
        <canvas id="pixi-canvas"></canvas>
        <div id="ui-root"></div>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
